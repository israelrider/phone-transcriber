[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phone-transcriber"
version = "0.1.0"
description = "Hebrew phone-call MP3 → text via Whisper (local) + Ollama Cloud cleanup"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-whisper>=20240930",
    "httpx>=0.27,<0.29",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
phone-transcriber = "phone_transcriber.cli:main"

[tool.hatch.build.targets.sdist]
include = ["phone_transcriber", "README.md", "pyproject.toml"]
